<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - SaaS Platform</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(circle at top left, rgba(79, 70, 229, 0.10), transparent 35%),
                radial-gradient(circle at bottom right, rgba(99, 102, 241, 0.08), transparent 35%),
                #f8fafc;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                "Segoe UI", sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 36px;
            box-shadow:
                0 20px 45px rgba(15, 23, 42, 0.08),
                0 4px 12px rgba(15, 23, 42, 0.04);
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: linear-gradient(135deg, #4f46e5, #4338ca);
            color: #ffffff;
            font-size: 24px;
            box-shadow: 0 10px 22px rgba(79, 70, 229, 0.25);
        }

        .brand-title {
            margin: 0;
            text-align: center;
            color: #111827;
            font-size: 26px;
            line-height: 1.2;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            margin: 6px 0 0;
            text-align: center;
            color: #6b7280;
            font-size: 13px;
        }

        .login-header {
            margin-bottom: 24px;
        }

        .field {
            margin-bottom: 16px;
        }

        .field-label {
            display: block;
            margin-bottom: 6px;
            color: #374151;
            font-size: 13px;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 14px;
            pointer-events: none;
        }

        .form-input, .form-select {
            width: 100%;
            height: 44px;
            padding: 0 14px 0 42px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            background: #ffffff;
            color: #111827;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-input::placeholder {
            color: #9ca3af;
        }

        .form-input:hover, .form-select:hover {
            border-color: #a5b4fc;
        }

        .form-input:focus, .form-select:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            padding: 4px;
            border: 0;
            background: transparent;
            color: #9ca3af;
            cursor: pointer;
            font-size: 14px;
        }

        .error-message {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 18px;
            padding: 12px 14px;
            border: 1px solid #fecaca;
            border-radius: 10px;
            background: #fef2f2;
            color: #b91c1c;
            font-size: 13px;
            line-height: 1.5;
        }

        .submit-button {
            width: 100%;
            height: 44px;
            border: 0;
            border-radius: 10px;
            background: #4f46e5;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(79, 70, 229, 0.20);
            transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
            margin-top: 8px;
        }

        .submit-button:hover {
            background: #4338ca;
            box-shadow: 0 8px 18px rgba(79, 70, 229, 0.26);
        }

        .secure-note {
            margin: 20px 0 0;
            text-align: center;
            color: #6b7280;
            font-size: 13px;
        }

        .secure-note a {
            color: #4f46e5;
            font-weight: 600;
            text-decoration: none;
        }

        .secure-note a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <main class="login-card" aria-labelledby="register-title">
        <div class="login-header">
            <div class="brand-icon" aria-hidden="true">
                <i class="fas fa-user-plus"></i>
            </div>

            <h1 id="register-title" class="brand-title">Create Account</h1>
            <p class="brand-subtitle">Sign up to access your business portal</p>
        </div>

        <div id="errorMessage" class="error-message hidden" role="alert">
            <i class="fas fa-circle-exclamation mt-0.5"></i>
            <span id="errorText">Failed to register account. Please try again.</span>
        </div>

        <form id="registerForm" method="POST">
            <div class="field">
                <label for="id_username" class="field-label">Username</label>
                <div class="input-wrapper">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" name="username" id="id_username" class="form-input" placeholder="john_doe" required autofocus>
                </div>
            </div>

            <div class="field">
                <label for="id_email" class="field-label">Email Address</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" name="email" id="id_email" class="form-input" placeholder="john@example.com" required>
                </div>
            </div>

            <div class="field">
                <label for="id_phone" class="field-label">Phone Number (Optional)</label>
                <div class="input-wrapper">
                    <i class="fas fa-phone input-icon"></i>
                    <input type="text" name="phone" id="id_phone" class="form-input" placeholder="+8801700000000">
                </div>
            </div>

            <div class="field">
                <label for="id_company_name" class="field-label">Company Name</label>
                <div class="input-wrapper">
                    <i class="fas fa-building input-icon"></i>
                    <input type="text" name="company_name" id="id_company_name" class="form-input" placeholder="e.g. Acme Corp" required>
                </div>
            </div>

            <div class="field">
                <label class="field-label mb-2">Choose Free Tier Modules</label>
                <div class="grid grid-cols-2 gap-3 p-3 bg-gray-50 border border-gray-200 rounded-xl">
                    <label class="flex items-center gap-2 cursor-pointer text-xs font-semibold text-gray-700">
                        <input type="checkbox" name="modules" value="hrm" class="w-4 h-4 text-indigo-600 rounded border-gray-300 focus:ring-indigo-500" checked>
                        <span><i class="fas fa-users-cog text-indigo-600 mr-1"></i> HR & Payroll</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer text-xs font-semibold text-gray-700">
                        <input type="checkbox" name="modules" value="ecommerce" class="w-4 h-4 text-indigo-600 rounded border-gray-300 focus:ring-indigo-500">
                        <span><i class="fas fa-shopping-cart text-indigo-600 mr-1"></i> Ecommerce</span>
                    </label>
                </div>
            </div>

            <div class="field">
                <label for="id_password" class="field-label">Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" name="password" id="id_password" class="form-input" placeholder="Enter secure password" required>
                    <button type="button" id="togglePasswordBtn" class="password-toggle" aria-label="Show password">
                        <i class="fas fa-eye" id="togglePasswordIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="submit-button">
                Sign Up
            </button>
        </form>

        <p class="secure-note">
            Already have an account? <a href="/auth/login">Sign In</a>
        </p>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const passwordInput = document.getElementById("id_password");
            const toggleButton = document.getElementById("togglePasswordBtn");
            const toggleIcon = document.getElementById("togglePasswordIcon");
            const registerForm = document.getElementById("registerForm");
            const errorMessage = document.getElementById("errorMessage");
            const errorText = document.getElementById("errorText");

            if (toggleButton && passwordInput && toggleIcon) {
                toggleButton.addEventListener("click", function () {
                    const isPassword = passwordInput.type === "password";
                    passwordInput.type = isPassword ? "text" : "password";
                    toggleIcon.classList.toggle("fa-eye", !isPassword);
                    toggleIcon.classList.toggle("fa-eye-slash", isPassword);
                });
            }

            if (registerForm) {
                registerForm.addEventListener("submit", async function (e) {
                    e.preventDefault();
                    if (errorMessage) errorMessage.classList.add("hidden");

                    const username = document.getElementById("id_username").value;
                    const email = document.getElementById("id_email").value;
                    const phone = document.getElementById("id_phone").value;
                    const companyName = document.getElementById("id_company_name").value;
                    const password = passwordInput.value;

                    const checkedModules = Array.from(document.querySelectorAll('input[name="modules"]:checked')).map(cb => cb.value);

                    const payload = {
                        username: username,
                        email: email,
                        phone: phone || null,
                        company_name: companyName || null,
                        modules: checkedModules,
                        password: password
                    };

                    try {
                        const response = await fetch("/auth/register", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                            },
                            body: JSON.stringify(payload),
                        });

                        const data = await response.json();

                        if (response.ok) {
                            window.location.href = "/auth/login?registered=1";
                        } else {
                            if (errorText) {
                                errorText.textContent = data.detail || "Failed to register account. Please try again.";
                            }
                            if (errorMessage) errorMessage.classList.remove("hidden");
                        }
                    } catch (err) {
                        if (errorText) {
                            errorText.textContent = "An unexpected error occurred. Please try again.";
                        }
                        if (errorMessage) errorMessage.classList.remove("hidden");
                    }
                });
            }
        });
    </script>
</body>
</html>
