{% extends "base.html" %}

{% block title %}500 - Server Error | SaaS Platform{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-white border border-gray-200 rounded-3xl p-8 shadow-xl text-center">
        <!-- 500 Icon -->
        <div class="mx-auto w-16 h-16 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center text-2xl font-bold mb-6 shadow-inner">
            <i class="fas fa-exclamation-triangle"></i>
        </div>

        <!-- Heading -->
        <h1 class="text-3xl font-black text-gray-900 tracking-tight mb-2">
            500
        </h1>
        <h2 class="text-lg font-bold text-gray-800 mb-2">
            Server Error
        </h2>
        <p class="text-xs font-semibold text-rose-700 bg-rose-50 inline-block px-3 py-1 rounded-full mb-4 border border-rose-200">
            Unexpected Internal Error
        </p>

        <!-- Detail Message -->
        <div class="bg-gray-50 border border-gray-100 rounded-2xl p-4 mb-6 text-xs text-gray-600 leading-relaxed text-left">
            <i class="fas fa-info-circle text-rose-500 mr-1.5"></i>
            <span>Something went wrong on our end. Please try again later or contact support if the problem persists.</span>
        </div>

        <!-- Actions -->
        <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
            <a href="/" class="w-full sm:w-auto px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs transition-colors flex items-center justify-center gap-2 shadow-sm">
                <i class="fas fa-home"></i> Back to Dashboard
            </a>
            <button onclick="window.location.reload();" class="w-full sm:w-auto px-5 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl text-xs transition-colors flex items-center justify-center gap-2">
                <i class="fas fa-redo"></i> Refresh Page
            </button>
        </div>
    </div>
</div>
{% endblock %}
