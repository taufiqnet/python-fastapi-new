{% extends "base.html" %}

{% block title %}Apply for Leave | HR & Payroll{% endblock %}

{% block head %}
<style>
    .tab-btn {
        padding: 10px 16px;
        font-size: 13px;
        font-weight: 600;
        color: #6b7280;
        border-bottom: 2px solid transparent;
        transition: all 0.15s ease;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        white-space: nowrap;
    }
    .tab-btn.active {
        color: #4f46e5;
        border-color: #4f46e5;
    }
    .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }
    .form-label {
        font-size: 12px;
        font-weight: 600;
        color: #374151;
    }
    .form-input {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        font-size: 13px;
        color: #111827;
        background-color: #fff;
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-input:focus {
        border-color: #4f46e5;
        box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.1);
    }
</style>
{% endblock %}

{% block content %}

<!-- Page Header -->
<div class="flex items-center justify-between mb-6">
    <div>
        <div class="flex items-center gap-2 mb-1">
            <a href="/leave/applications/manage" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium flex items-center gap-1">
                <i class="fas fa-arrow-left text-[10px]"></i> Back to Applications
            </a>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 tracking-tight">
            Apply for Leave
        </h1>
        <p class="text-xs text-gray-500 font-medium">
            Submit a new leave request for review and approval
        </p>
    </div>
</div>

<form id="leaveApplicationForm" class="space-y-6" onsubmit="handleApplicationSubmit(event)">

    <div class="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm">
        
        <!-- Tab Headers -->
        <div class="border-b border-gray-200 bg-gray-50/50 px-4 flex overflow-x-auto custom-scrollbar">
            <button type="button" class="tab-btn active">
                <i class="fas fa-calendar-check text-xs"></i> Leave Request Details
            </button>
        </div>

        <div class="p-6">
            <div class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="form-group">
                        <label class="form-label" for="business_id">Business Profile <span class="text-red-500">*</span></label>
                        <select id="business_id" name="business_id" class="form-input" required>
                            <option value="">— Select Business —</option>
                            {% for b in businesses %}
                            <option value="{{ b.id }}">{{ b.name_en }} (ID: {{ b.id }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="employee_id">Applicant Employee <span class="text-red-500">*</span></label>
                        <select id="employee_id" name="employee_id" class="form-input" required>
                            <option value="">— Select Employee —</option>
                            {% for e in employees %}
                            <option value="{{ e.id }}">{{ e.full_name }} ({{ e.employee_id }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="leave_type_id">Leave Type <span class="text-red-500">*</span></label>
                        <select id="leave_type_id" name="leave_type_id" class="form-input" required>
                            <option value="">— Select Leave Type —</option>
                            {% for lt in leave_types %}
                            <option value="{{ lt.id }}">{{ lt.name }} ({{ lt.code }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="number_of_days">Number of Days <span class="text-red-500">*</span></label>
                        <input type="number" step="0.5" min="0.5" id="number_of_days" name="number_of_days" class="form-input" required placeholder="e.g. 1.0">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="start_date">Start Date <span class="text-red-500">*</span></label>
                        <input type="date" id="start_date" name="start_date" class="form-input" required onchange="calculateDays()">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="end_date">End Date <span class="text-red-500">*</span></label>
                        <input type="date" id="end_date" name="end_date" class="form-input" required onchange="calculateDays()">
                    </div>

                    <div class="form-group md:col-span-2">
                        <label class="form-label" for="reason">Reason for Leave</label>
                        <textarea id="reason" name="reason" rows="3" class="form-input" placeholder="Provide any details regarding your leave application..."></textarea>
                    </div>
                </div>
            </div>
        </div>

        <!-- Form Actions Footer -->
        <div class="border-t border-gray-200 bg-gray-50 px-6 py-4 flex items-center justify-end gap-3">
            <a href="/leave/applications/manage" class="px-4 py-2 border border-gray-200 hover:bg-gray-100 text-gray-700 text-xs font-semibold rounded-lg transition-colors">
                Cancel
            </a>
            <button type="submit" id="btnSubmit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-lg shadow-sm transition-colors flex items-center gap-2">
                <i class="fas fa-paper-plane"></i> Submit Application
            </button>
        </div>
    </div>
</form>

{% endblock %}

{% block extra_js %}
<script>
function calculateDays() {
    const sDate = document.getElementById('start_date').value;
    const eDate = document.getElementById('end_date').value;
    if (sDate && eDate) {
        const d1 = new Date(sDate);
        const d2 = new Date(eDate);
        if (d2 >= d1) {
            const diffTime = Math.abs(d2 - d1);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
            document.getElementById('number_of_days').value = diffDays.toFixed(1);
        }
    }
}

function handleApplicationSubmit(event) {
    event.preventDefault();

    const payload = {
        business_id: parseInt(document.getElementById('business_id').value),
        employee_id: document.getElementById('employee_id').value,
        leave_type_id: document.getElementById('leave_type_id').value,
        start_date: document.getElementById('start_date').value,
        end_date: document.getElementById('end_date').value,
        number_of_days: parseFloat(document.getElementById('number_of_days').value),
        reason: document.getElementById('reason').value || null
    };

    const btnSubmit = document.getElementById('btnSubmit');
    btnSubmit.disabled = true;
    btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';

    fetch('/leave-applications', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
        },
        body: JSON.stringify(payload)
    })
    .then(async response => {
        const data = await response.json();
        if (!response.ok) {
            let msg = data.detail || 'Failed to submit application';
            if (Array.isArray(data.detail)) {
                msg = data.detail.map(e => e.msg || e.detail).join(', ');
            }
            throw new Error(msg);
        }
        return data;
    })
    .then(data => {
        showSuccessToast('Application Submitted', 'Your leave request has been submitted for review.');
        setTimeout(() => { window.location.href = '/leave/applications/manage'; }, 1200);
    })
    .catch(err => {
        showErrorAlert('Submission Failed', err.message);
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '<i class="fas fa-paper-plane"></i> Submit Application';
    });
}
</script>
{% endblock %}
