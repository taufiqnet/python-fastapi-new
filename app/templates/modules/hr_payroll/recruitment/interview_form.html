{% extends "base.html" %}

{% block title %}Schedule Interview | HR & Payroll{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto mb-8">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Schedule Interview</h1>
            <p class="text-xs text-gray-500 mt-0.5">Configure interview schedule and panel members</p>
        </div>
        <a href="/recruitment/interviews/manage" class="px-3.5 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-xl text-xs transition-colors">
            <i class="fas fa-arrow-left mr-1"></i> Back to Interviews
        </a>
    </div>

    <div class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm">
        <form id="interview-form" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Business Profile <span class="text-rose-500">*</span></label>
                <select id="business_id" required class="w-full text-xs border border-gray-200 rounded-lg p-2.5 outline-none focus:ring-1 focus:ring-indigo-500">
                    <option value="">-- Select Business --</option>
                    {% for b in businesses %}
                    <option value="{{ b.id }}">{{ b.name_en }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Candidate <span class="text-rose-500">*</span></label>
                    <select id="candidate_id" required class="w-full text-xs border border-gray-200 rounded-lg p-2.5 outline-none focus:ring-1 focus:ring-indigo-500">
                        <option value="">-- Select Candidate --</option>
                        {% for c in candidates %}
                        <option value="{{ c.id }}">{{ c.full_name }} ({{ c.email }})</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Interviewer (Employee) <span class="text-rose-500">*</span></label>
                    <select id="interviewer_id" required class="w-full text-xs border border-gray-200 rounded-lg p-2.5 outline-none focus:ring-1 focus:ring-indigo-500">
                        <option value="">-- Select Interviewer --</option>
                        {% for e in employees %}
                        <option value="{{ e.id }}">{{ e.full_name }} ({{ e.employee_id }})</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Stage <span class="text-rose-500">*</span></label>
                    <select id="stage" required class="w-full text-xs border border-gray-200 rounded-lg p-2.5 outline-none focus:ring-1 focus:ring-indigo-500">
                        <option value="initial_screening">Initial Screening</option>
                        <option value="technical" selected>Technical Round</option>
                        <option value="hr_round">HR Round</option>
                        <option value="final_round">Final Round</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Date & Time <span class="text-rose-500">*</span></label>
                    <input type="datetime-local" id="scheduled_at" required class="w-full text-xs border border-gray-200 rounded-lg p-2.5 outline-none focus:ring-1 focus:ring-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Duration (Mins)</label>
                    <input type="number" id="duration_minutes" value="60" min="15" step="15" class="w-full text-xs border border-gray-200 rounded-lg p-2.5 outline-none focus:ring-1 focus:ring-indigo-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-700 mb-1">Location / Meeting Link</label>
                <input type="text" id="location_link" placeholder="Google Meet / Zoom URL or Room 302" class="w-full text-xs border border-gray-200 rounded-lg p-2.5 outline-none focus:ring-1 focus:ring-indigo-500">
            </div>

            <div class="pt-4 border-t border-gray-100 flex items-center justify-end gap-3">
                <a href="/recruitment/interviews/manage" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-semibold rounded-lg transition-colors">Cancel</a>
                <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-lg transition-colors shadow-sm">
                    Schedule Interview
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('interview-form').addEventListener('submit', function(e) {
    e.preventDefault();

    const payload = {
        business_id: parseInt(document.getElementById('business_id').value),
        candidate_id: document.getElementById('candidate_id').value,
        interviewer_id: document.getElementById('interviewer_id').value,
        stage: document.getElementById('stage').value,
        scheduled_at: document.getElementById('scheduled_at').value,
        duration_minutes: parseInt(document.getElementById('duration_minutes').value),
        location_link: document.getElementById('location_link').value || null
    };

    fetch('/recruitment/interviews', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(payload)
    })
    .then(res => {
        if (!res.ok) return res.json().then(err => { throw new Error(err.detail || 'Failed'); });
        return res.json();
    })
    .then(data => {
        showSuccessToast('Success', 'Interview scheduled successfully.');
        setTimeout(() => window.location.href = '/recruitment/interviews/manage', 1000);
    })
    .catch(err => showErrorAlert('Error', err.message));
});
</script>
{% endblock %}
