<!-- HR & PAYROLL MODULE -->
<div class="sidebar-dropdown {% if active_page in ['departments', 'job_titles', 'employees', 'employees2', 'leave_types', 'leave_allocations', 'leave_applications', 'attendance', 'compensation'] %}expanded{% endif %}" data-module="hr_payroll">
    <button type="button" class="sidebar-dropdown-toggle {% if active_page in ['departments', 'job_titles', 'employees', 'employees2', 'leave_types', 'leave_allocations', 'leave_applications', 'attendance', 'compensation'] %}active{% endif %}">
        <span class="flex items-center">
            <i class="fas fa-users-cog w-4 text-sm shrink-0"></i>
            <span class="ml-3 text-[13px] font-medium sidebar-text">HR & Payroll</span>
        </span>
        <i class="fas fa-chevron-right text-[10px] dropdown-arrow"></i>
    </button>

    <div class="sidebar-dropdown-menu space-y-1">
        <a href="/departments/manage" class="sidebar-link relative flex items-center px-3 py-2 rounded-lg transition-all duration-200 {% if active_page == 'departments' %}bg-indigo-50 text-indigo-700{% else %}text-gray-700 hover:bg-gray-100{% endif %}">
            <i class="fas fa-sitemap w-4 text-sm shrink-0"></i>
            <span class="ml-3 text-[13px] font-medium sidebar-text transition-opacity duration-300">
                Department
            </span>
            <span class="sidebar-tooltip">

            </span>
        </a>

            <i class="fas fa-user-tie w-4 text-sm shrink-0"></i>
            <span class="ml-3 text-[13px] font-medium sidebar-text transition-opacity duration-300">
                Job Title
            </span>
            <span class="sidebar-tooltip">
                Job Title
            </span>
        </a>
        <a href="/leave/types/manage" class="sidebar-link relative flex items-center px-3 py-2 rounded-lg transition-all duration-200 {% if active_page == 'leave_types' %}bg-indigo-50 text-indigo-700{% else %}text-gray-700 hover:bg-gray-100{% endif %}">
            <i class="fas fa-umbrella-beach w-4 text-sm shrink-0"></i>
            <span class="ml-3 text-[13px] font-medium sidebar-text transition-opacity duration-300">
                Leave Types
            </span>

                Leave Allocations
            </span>
            <span class="sidebar-tooltip">

            </span>
            <span class="sidebar-tooltip">

            </span>
        </a>
        <a href="/compensation/manage" class="sidebar-link relative flex items-center px-3 py-2 rounded-lg transition-all duration-200 {% if active_page == 'compensation' %}bg-indigo-50 text-indigo-700{% else %}text-gray-700 hover:bg-gray-100{% endif %}">
