<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SaaS Platform</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(circle at top left, rgba(79, 70, 229, 0.10), transparent 35%),
                radial-gradient(circle at bottom right, rgba(99, 102, 241, 0.08), transparent 35%),
                #f8fafc;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                "Segoe UI", sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 40px;
            box-shadow:
                0 20px 45px rgba(15, 23, 42, 0.08),
                0 4px 12px rgba(15, 23, 42, 0.04);
        }

        .brand-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background: linear-gradient(135deg, #4f46e5, #4338ca);
            color: #ffffff;
            font-size: 28px;
            box-shadow: 0 10px 22px rgba(79, 70, 229, 0.25);
        }

        .brand-title {
            margin: 0;
            text-align: center;
            color: #111827;
            font-size: 30px;
            line-height: 1.2;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            margin: 8px 0 0;
            text-align: center;
            color: #6b7280;
            font-size: 14px;
        }

        .login-header {
            margin-bottom: 32px;
        }

        .field {
            margin-bottom: 22px;
        }

        .field-label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-size: 13px;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 15px;
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            height: 48px;
            padding: 0 46px 0 44px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            background: #ffffff;
            color: #111827;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-input::placeholder {
            color: #9ca3af;
        }

        .form-input:hover {
            border-color: #a5b4fc;
        }

        .form-input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            padding: 4px;
            border: 0;
            background: transparent;
            color: #9ca3af;
            cursor: pointer;
            font-size: 15px;
        }

        .password-toggle:hover {
            color: #4f46e5;
        }

        .password-toggle:focus {
            outline: 2px solid rgba(79, 70, 229, 0.25);
            outline-offset: 2px;
            border-radius: 4px;
        }

        .error-message {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 22px;
            padding: 12px 14px;
            border: 1px solid #fecaca;
            border-radius: 10px;
            background: #fef2f2;
            color: #b91c1c;
            font-size: 13px;
            line-height: 1.5;
        }

        .error-message i {
            margin-top: 2px;
        }

        .submit-button {
            width: 100%;
            height: 48px;
            border: 0;
            border-radius: 10px;
            background: #4f46e5;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(79, 70, 229, 0.20);
            transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
        }

        .submit-button:hover {
            background: #4338ca;
            box-shadow: 0 8px 18px rgba(79, 70, 229, 0.26);
        }

        .submit-button:active {
            transform: translateY(1px);
        }

        .secure-note {
            margin: 24px 0 0;
            text-align: center;
            color: #9ca3af;
            font-size: 12px;
        }

        .secure-note i {
            margin-right: 5px;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .login-card {
                padding: 30px 22px;
                border-radius: 14px;
            }

            .brand-title {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>
    <main class="login-card" aria-labelledby="login-title">
        <div class="login-header">
            <div class="brand-icon" aria-hidden="true">
                <i class="fas fa-shield-halved"></i>
            </div>

            <h1 id="login-title" class="brand-title">Welcome</h1>
            <p class="brand-subtitle">Sign in to access the management system</p>
        </div>

        <div id="errorMessage" class="error-message hidden" role="alert">
            <i class="fas fa-circle-exclamation"></i>
            <span id="errorText">Your email address or password is incorrect. Please try again.</span>
        </div>

        <form id="loginForm" method="POST">
            <div class="field">
                <label for="id_username" class="field-label">Email Address or Username</label>

                <div class="input-wrapper">
                    <i class="fas fa-envelope input-icon" aria-hidden="true"></i>

                    <input
                        type="text"
                        name="username"
                        id="id_username"
                        class="form-input"
                        placeholder="admin@example.com"
                        autocomplete="username"
                        required
                        autofocus
                    >
                </div>
            </div>

            <div class="field">
                <label for="id_password" class="field-label">Password</label>

                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon" aria-hidden="true"></i>

                    <input
                        type="password"
                        name="password"
                        id="id_password"
                        class="form-input"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        id="togglePasswordBtn"
                        class="password-toggle"
                        aria-label="Show password"
                        aria-pressed="false"
                    >
                        <i class="fas fa-eye" id="togglePasswordIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="submit-button">
                Sign In
            </button>
        </form>

        <p class="secure-note">
            <i class="fas fa-lock"></i>
            Authorized users only
        </p>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const passwordInput = document.getElementById("id_password");
            const toggleButton = document.getElementById("togglePasswordBtn");
            const toggleIcon = document.getElementById("togglePasswordIcon");
            const loginForm = document.getElementById("loginForm");
            const errorMessage = document.getElementById("errorMessage");
            const errorText = document.getElementById("errorText");

            if (toggleButton && passwordInput && toggleIcon) {
                toggleButton.addEventListener("click", function () {
                    const isPassword = passwordInput.type === "password";

                    passwordInput.type = isPassword ? "text" : "password";
                    toggleIcon.classList.toggle("fa-eye", !isPassword);
                    toggleIcon.classList.toggle("fa-eye-slash", isPassword);

                    toggleButton.setAttribute(
                        "aria-label",
                        isPassword ? "Hide password" : "Show password"
                    );

                    toggleButton.setAttribute(
                        "aria-pressed",
                        String(isPassword)
                    );
                });
            }

            if (loginForm) {
                loginForm.addEventListener("submit", async function (e) {
                    e.preventDefault();
                    if (errorMessage) errorMessage.classList.add("hidden");

                    const username = document.getElementById("id_username").value;
                    const password = passwordInput.value;

                    const formData = new URLSearchParams();
                    formData.append("username", username);
                    formData.append("password", password);

                    try {
                        const response = await fetch("/auth/login", {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/x-www-form-urlencoded",
                            },
                            body: formData,
                        });

                        const data = await response.json();

                        if (response.ok && data.access_token) {
                            localStorage.setItem("access_token", data.access_token);
                            window.location.href = "/";
                        } else {
                            if (errorText) {
                                errorText.textContent = data.detail || "Your email address or password is incorrect. Please try again.";
                            }
                            if (errorMessage) errorMessage.classList.remove("hidden");
                        }
                    } catch (err) {
                        if (errorText) {
                            errorText.textContent = "An unexpected error occurred. Please try again.";
                        }
                        if (errorMessage) errorMessage.classList.remove("hidden");
                    }
                });
            }
        });
    </script>
</body>
</html>
