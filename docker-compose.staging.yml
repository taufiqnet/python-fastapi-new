services:
  api:
    build: .
    container_name: proerp_api_staging
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file:
      - .env.staging
    environment:
      DB_HOST: db
      APP_ENV: staging
      TZ: Asia/Dhaka
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./tests:/app/tests
      - staging_storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: proerp_frontend_staging
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001
      TZ: Asia/Dhaka
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

  db:
    image: postgres:16
    container_name: proerp_postgres_staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      POSTGRES_DB: ${DB_NAME:-fastapi_staging}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-staging_secret_pass}
      TZ: Asia/Dhaka
    ports:
      - "5433:5432"
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-fastapi_staging}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_staging_data:
  staging_storage:
